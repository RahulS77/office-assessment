<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computer & Office Fundamentals Assessment</title>
<style>
:root {
  --bg: #e9eef4;
  --surface: #ffffff;
  --surface-2: #f3f6fa;
  --ink: #17212c;
  --muted: #56636f;
  --line: #cfd8e2;
  --accent: #1f4f9c;
  --accent-ink: #ffffff;
  --key: #fbfcfe;
  --key-edge: #b9c4d0;
  --ok: #1d7446;
  --ok-bg: #e4f3ea;
  --bad: #b0342b;
  --bad-bg: #fbe8e6;
  --warn-bg: #fff4d9;
  --warn-ink: #6b4b00;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161d;
    --surface: #18212b;
    --surface-2: #1f2a36;
    --ink: #e5ebf1;
    --muted: #9aa8b6;
    --line: #2d3a48;
    --accent: #7ea4ec;
    --accent-ink: #0c1420;
    --key: #243140;
    --key-edge: #0b1016;
    --ok: #6fd39b;
    --ok-bg: #173325;
    --bad: #f08a80;
    --bad-bg: #3a1c1a;
    --warn-bg: #3a2f12;
    --warn-ink: #f2d792;
  }
}
:root[data-theme="dark"] {
  --bg: #10161d;
  --surface: #18212b;
  --surface-2: #1f2a36;
  --ink: #e5ebf1;
  --muted: #9aa8b6;
  --line: #2d3a48;
  --accent: #7ea4ec;
  --accent-ink: #0c1420;
  --key: #243140;
  --key-edge: #0b1016;
  --ok: #6fd39b;
  --ok-bg: #173325;
  --bad: #f08a80;
  --bad-bg: #3a1c1a;
  --warn-bg: #3a2f12;
  --warn-ink: #f2d792;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  font-size: 1rem;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
header.top { margin-bottom: 1.25rem; }
header.top h1 { font-size: clamp(1.35rem, 4.5vw, 1.75rem); line-height: 1.2; margin: 0 0 .35rem; letter-spacing: -.01em; }
header.top p { margin: 0; color: var(--muted); }
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1.25rem;
}
@media (min-width: 560px) { .panel { padding: 1.75rem; } }
h2 { font-size: 1.2rem; margin: 0 0 1rem; line-height: 1.3; }
label.field { display: block; margin-bottom: 1rem; }
label.field span.lbl { display: block; font-weight: 600; margin-bottom: .3rem; }
input[type="text"], input[type="email"], input[type="tel"] {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: .65rem .75rem;
}
input:focus-visible, button:focus-visible, textarea:focus-visible, .choice:focus-within {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
input[aria-invalid="true"] { border-color: var(--bad); }
.err { color: var(--bad); font-size: .9rem; margin-top: .25rem; min-height: 0; }
.err:empty { display: none; }
.row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }
button {
  font: inherit;
  font-weight: 600;
  border-radius: 8px;
  padding: .65rem 1.2rem;
  cursor: pointer;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
  min-height: 2.75rem;
}
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
.hidden { display: none !important; }

/* Quiz */
.meta { display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap; font-size: .92rem; color: var(--muted); margin-bottom: .5rem; }
.meta strong { color: var(--ink); }
.bar { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 1.5rem; }
.bar > div { height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
@media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
.qtext { font-size: 1.15rem; font-weight: 600; line-height: 1.4; margin: 0 0 1.25rem; }
.choices { display: grid; gap: .6rem; margin-bottom: 1.5rem; }
.choice {
  display: flex; align-items: center; gap: .85rem;
  padding: .7rem .85rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  cursor: pointer;
}
.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.choice:hover { border-color: var(--accent); }
.choice.sel { border-color: var(--accent); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--accent); }
.key {
  flex: 0 0 auto;
  display: inline-grid; place-items: center;
  width: 2.1rem; height: 2.1rem;
  font-weight: 700; font-size: .95rem;
  background: var(--key);
  border: 1px solid var(--key-edge);
  border-bottom-width: 3px;
  border-radius: 6px;
  color: var(--ink);
}
.choice.sel .key { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Results */
.score { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; margin: .25rem 0 .5rem; }
.score .big { font-size: 2.6rem; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.score .pct { font-size: 1.1rem; color: var(--muted); }
.note { padding: .75rem .9rem; border-radius: 8px; margin: 1rem 0; font-size: .95rem; }
.note.info { background: var(--surface-2); border: 1px solid var(--line); }
.note.ok { background: var(--ok-bg); color: var(--ok); }
